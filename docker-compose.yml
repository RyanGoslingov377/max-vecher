# Запуск: docker compose up --build  → http://localhost:3000
# Перед запуском: copy .env.example .env (токен не нужен: по умолчанию BOT_ENABLED=0, бот работает на хостинге)
services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/data
    restart: unless-stopped

volumes:
  app-storage:
